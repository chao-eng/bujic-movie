name: Build and Push Docker Image to Aliyun ACR

# 只支持手动触发：不再随 push 自动构建镜像。
# 需要发布时到 Actions 页面选中本工作流，点「Run workflow」。
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '版本更新说明（单行；需要多行时改用 release_notes_file）'
        required: false
        default: ''
        type: string
      release_notes_file:
        description: '仓库内更新说明文件路径（如 doc/release-notes.md），优先于上一项'
        required: false
        default: ''
        type: string
      version_tag:
        description: '版本标签，留空则使用当天日期 vYYYY.MM.DD'
        required: false
        default: ''
        type: string
      create_release:
        description: '构建成功后创建 tag 与 release'
        required: false
        default: true
        type: boolean
      platforms:
        description: '构建的镜像架构（多架构用英文逗号分隔）'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      push_latest:
        description: '是否同时打上 latest 标签'
        required: false
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 创建 tag 与 release 需要写仓库内容的权限
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 设置 QEMU 方便构建多架构镜像
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx 以启用更高级的构建特性和缓存支持
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 生成日期版本号（采用北京时区 Asia/Shanghai，防止 UTC 时差导致日期不准）
      # 同时整理镜像标签：latest 是否发布由手动触发的开关决定。
      - name: Get Current Date Tag
        id: get-date
        run: |
          echo "tag=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "date_only=$(TZ=Asia/Shanghai date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "version_date=$(TZ=Asia/Shanghai date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

          # 空行会被 build-push-action 当成非法标签，所以标签列表在脚本里拼好。
          IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}"
          {
            echo "${IMAGE}:$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
            echo "${IMAGE}:$(TZ=Asia/Shanghai date +'%Y%m%d')"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
          } > /tmp/image-tags.txt
          {
            echo "tags<<EOF"
            cat /tmp/image-tags.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
          ALIYUN_REPOSITORY: ${{ secrets.ALIYUN_REPOSITORY }}
          PUSH_LATEST: ${{ inputs.push_latest }}

      # 登录到阿里云容器镜像服务 (ACR)
      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 构建并推送镜像
      - name: Build and Push to ACR
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/deployments/Dockerfile
          push: true
          # 手动触发时可在「Run workflow」里改架构，默认与之前一致
          platforms: ${{ inputs.platforms }}
          # 标签由上一步拼好：分秒时间戳、日期，以及（可选）latest
          tags: ${{ steps.get-date.outputs.tags }}
          # 启用 GitHub Actions 缓存，加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 阿里云 ACR 不支持 OCI 附加的 provenance/sbom 清单，需关闭避免推送被拒
          provenance: false
          sbom: false

      # 构建成功后才建 tag 与 release：镜像推不上去就不该对外发布版本。
      # gh release create 会同时创建指向该提交的 tag，避免自己打 tag 再推送。
      - name: Create Tag and Release
        id: release
        if: ${{ inputs.create_release }}
        run: |
          set -euo pipefail

          # 版本标签：优先用传入值，留空则取当天日期。统一加 v 前缀。
          raw="${VERSION_TAG}"
          if [ -z "$raw" ]; then
            raw="v${VERSION_DATE}"
          fi
          case "$raw" in
            v*) tag="$raw" ;;
            *)  tag="v${raw}" ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # 同名 tag 已存在就停下：覆盖发布版本等于悄悄改变用户拿到的内容。
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::标签 ${tag} 已存在。请换一个 version_tag，或先删除该标签与 release。"
            exit 1
          fi

          # 说明优先取文件（可多行、可进版本库审阅），否则用单行输入。
          notes=""
          if [ -n "${NOTES_FILE}" ]; then
            if [ ! -f "${NOTES_FILE}" ]; then
              echo "::error::更新说明文件不存在：${NOTES_FILE}"
              exit 1
            fi
            notes="$(cat "${NOTES_FILE}")"
          elif [ -n "${RELEASE_NOTES}" ]; then
            notes="${RELEASE_NOTES}"
          fi
          if [ -z "${notes}" ]; then
            echo "::error::请填写 release_notes 或指定 release_notes_file。"
            exit 1
          fi

          # 把本次推送的镜像也附在末尾，部署时直接复制。
          {
            printf '%s\n\n' "${notes}"
            echo '---'
            echo ''
            echo '**镜像**'
            echo ''
            echo '```'
            cat /tmp/image-tags.txt
            echo '```'
            echo ''
            echo "架构：\`${PLATFORMS}\`"
          } > /tmp/release-notes.md

          # --target 用仓库默认分支：gh 的该参数要分支名，传 SHA 虽可用但未在
          # 文档承诺；这里构建的就是该分支最新提交，tag 不会打偏。
          gh release create "$tag" \
            --target "${{ github.event.repository.default_branch }}" \
            --title "$tag" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.version_tag }}
          VERSION_DATE: ${{ steps.get-date.outputs.version_date }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          NOTES_FILE: ${{ inputs.release_notes_file }}
          PLATFORMS: ${{ inputs.platforms }}

      # 在 Actions 运行页打印镜像地址，方便直接复制去部署
      - name: Show Image Tags
        run: |
          {
            echo "### 已推送镜像"
            echo ""
            echo '```'
            cat /tmp/image-tags.txt
            echo '```'
            echo "架构：${{ inputs.platforms }}"
            if [ "${{ inputs.create_release }}" = "true" ]; then
              echo ""
              echo "已创建 Release：${{ steps.release.outputs.tag }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
