<!doctype html>
<html lang="zh-CN" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>布吉影库</title>
  <script>
    // 在样式加载前决定主题，避免亮色用户看到一帧暗色闪屏。
    // 与 composables/useTheme.ts 共用同一个 localStorage 键。
    (function () {
      try {
        var stored = localStorage.getItem('bujic-theme')
        var dark = stored === 'dark' ||
          ((stored === 'system' || !stored) && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {
        // 读不到 localStorage 时保留 <html class="dark"> 的默认值。
      }
    })()
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
